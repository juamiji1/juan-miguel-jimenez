<!-- Profile Photo -->
{{ with .Site.Params.avatar }}
  <div class="profile-pic">
    <img src="{{ . | relURL }}" alt="Profile picture">
  </div>
{{ end }}

<!-- Email -->
<p class="contactinfo">
  <a href="mailto:juamiji@gmail.com"><i class="fas fa-envelope"></i> juamiji@gmail.com</a>
</p>

<!-- Social icons -->
<div class="social-icons">
  {{ with .Site.Params.social.github }}
    <a href="{{ . }}" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
  {{ end }}
  {{ with .Site.Params.social.google_scholar }}
    <a href="{{ . }}" target="_blank" aria-label="Google Scholar"><i class="fas fa-graduation-cap"></i></a>
  {{ end }}
</div>

<div style="margin-bottom: 10px;"></div>
